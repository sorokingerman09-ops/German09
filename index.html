<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAKSLOXX — Брендовая одежда</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f0f1a;
      color: #eee;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 {
      font-size: 38px;
      color: #fff;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 15px;
      color: #e94560;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    .about {
      font-size: 17px;
      color: #bbb;
      margin-bottom: 36px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: block;
      padding: 18px;
      border-radius: 12px;
      background: #1a1a2e;
      border: 1px solid #2a2a44;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .link:hover {
      background: #e94560;
      border-color: #e94560;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 50px;
      font-size: 12px;
      color: #555;
      line-height: 1.8;
    }

    .footer a {
      color: #777;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card">

    <h1>German09</h1>
    <p class="tagline">Брендовая одежда</p>

    <p class="about">
      Оригинальные вещи из Европы и США.<br>
      Мужское и женское. Доставка по России.
    </p>

    <div class="links">
      <a href="[ссылка на Авито]" class="link">Авито</a>
      <a href="[ссылка на Ozon]" class="link">Ozon</a>
      <a href="[ссылка на Telegram]" class="link">Telegram</a>
      <a href="[ссылка на WhatsApp]" class="link">WhatsApp</a>
    </div>

    <div class="footer">
      <p>Связь: <a href="mailto:[твой email]">[твой email]</a></p>
      <p>© 2026 German09</p>
    </div>

  </div>

</body>
</html>
